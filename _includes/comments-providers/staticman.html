{% if site.repository and site.staticman.branch %}
  <script>
    (function ($) {
    var $comments = $('.js-comments');

    $('#new_comment').submit(function () {
      var form = this;

      $(form).addClass('disabled');
      $('#comment-form-submit').text({{ site.data.ui-text[site.locale].loading_label | default: "Loading..." | jsonify }});

      $.ajax({
        type: $(this).attr('method'),
        url: $(this).attr('action'),
        data: $(this).serialize(),
        contentType: 'application/x-www-form-urlencoded',
        dataType: 'json',
        success: function (data) {
          $('#comment-form-submit').text({{ site.data.ui-text[site.locale].comment_btn_submitted | default: "Submitted" | jsonify }});
          $('.page__comments-form .js-notice').removeClass('notice--danger');
          $('.page__comments-form .js-notice').addClass('notice--success');
          showAlert({{ site.data.ui-text[site.locale].comment_success_msg | default: "Thanks for your comment! It will show on the site once it has been approved." | jsonify }});
        },
        error: function (err) {
          console.log(err);
          $('#comment-form-submit').text({{ site.data.ui-text[site.locale].comment_btn_submit | default: "Submit Comment" | jsonify }});
          $('.page__comments-form .js-notice').removeClass('notice--success');
          $('.page__comments-form .js-notice').addClass('notice--danger');
          showAlert({{ site.data.ui-text[site.locale].comment_error_msg | default: "Sorry, there was an error with your submission. Please make sure all required fields have been completed and try again." | jsonify }});
          $(form).removeClass('disabled');
        }
      });

      return false;
    });

    function showAlert(message) {
      $('.page__comments-form .js-notice').removeClass('hidden');
      $('.page__comments-form .js-notice-text').text(message);
    }
  })(jQuery);
  </script>
{% endif %}
